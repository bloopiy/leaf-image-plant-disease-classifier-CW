project_name: PlantDisease
seed: 42

data:
  hf_dataset: "TODO_plant_village_hub_id"   # use the link given in the assignment
  subset_fraction: 0.25                     # 0.25 while prototyping, 1.0 for final runs
  split: {train: 0.70, val: 0.15, test: 0.15}
  image_size: 128
  augment: true
  num_workers: 2

model:
  name: cnn                  # cnn | resnet18
  channels: [32, 64, 128, 256]
  dropout: 0.3
  batch_norm: true
  num_classes: 39

train:
  optimizer: adamw           # adam | adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 30
  early_stopping_patience: 3
  scheduler: cosine          # none | cosine | step

clearml:
  tags: ["cnn", "baseline"]
