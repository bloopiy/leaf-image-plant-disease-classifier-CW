# Hyperparameters for code 
seed: 42
 
# --- model: owned by the CNN lead ---
model:
  num_classes: 39
  in_channels: 3
  input_size: ${data.image_size} # square input resolution fed to the CNN
  channels: [32, 64, 128]  # one entry per conv block; depth = len(channels)
  dense_units: [128]       # hidden dense layers in the head; [] = single linear layer
  pooling: flatten         # flatten | global_avg
  batch_norm: true         # BatchNorm2d after each conv, BatchNorm1d after hidden dense
  conv_dropout: 0.0        # Dropout2d after each conv block (0 = off)
  dense_dropout: 0.3       # Dropout after each hidden dense layer (0 = off)
 
train:
  epochs: 30
  patience: 3
  optimizer: adamw        # adam | adamw
  scheduler: none         # none | cosine
  lr: 0.001
  weight_decay: 0.0001    # AdamW weight decay for the from-scratch CNN
  batch_size: 32
  checkpoint_path: checkpoints/simple-cnn/best.pt

clearml:
  project_name: PlantDisease-CW
  task_name_prefix: simple-cnn
  offline: false

data:
  dataset:
    id: DScomp380/plant_village
  use_full_development_pool: false
  prototype_fraction: 0.25   # keep at 0.10 or more: tiny fractions break the stratified split
  image_size: 128               # square input resolution fed to the CNN (model.input_size follows it)
  splits:                       # development pool split; must sum to 1.0
    train: 0.7
    val: 0.15
    test: 0.15
  transformations:
    augment:                    # applied to training images only; enabled: false turns it off
      enabled: true
      flip_prob: 0.5
      degrees: 15
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
      blur_probability: 0.2
  loaders:                      # batch size is train.batch_size
    num_workers: 4
    pin_memory: true
