# Transfer learning (ResNet18) config.
# Keep key names in line with configs/default.yaml where they overlap
# (agree the train: keys with Swaraj, the data: keys with Aravind).

data:
  input_size: 224                       # ResNet18 expects ~224
  normalize_mean: [0.485, 0.456, 0.406] # ImageNet stats, needed for pretrained weights
  normalize_std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  num_classes: 39
  pretrained: true
  freeze_backbone: false                # true = train only the new fc layer

train:                                  # starting values, tune via ClearML sweeps
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 64
  epochs: 15
  early_stopping_patience: 3

clearml:
  task_name: resnet18-transfer
  tags: [scratch-ignore]                # switch to final-benchmark for report runs
