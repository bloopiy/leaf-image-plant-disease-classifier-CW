# Transfer learning (ResNet18) config. Same key layout as default.yaml, so the
# loaders, trainer, evaluation and app can all read either file.
seed: 42

data:
  dataset:
    id: DScomp380/plant_village
  use_full_development_pool: false
  prototype_fraction: 0.25

model:
  name: resnet18
  num_classes: 39
  pretrained: true
  freeze_backbone: false                # true = train only the new fc layer
  input_size: 224                       # under model: like default.yaml (the app reads model.input_size)
  normalize_mean: [0.485, 0.456, 0.406] # ImageNet stats, needed for pretrained weights
  normalize_std: [0.229, 0.224, 0.225]

train:                                  # starting values, tune via ClearML sweeps
  optimizer: adamw                      # adam | adamw (fit() reads this)
  scheduler: none                       # none | cosine (optional sweep)
  lr: 0.0001
  weight_decay: 0.01                    # AdamW weight decay for fine-tuning
  batch_size: 64
  epochs: 15
  patience: 3                           # fit() reads "patience" (not early_stopping_patience)
  checkpoint_path: checkpoints/resnet18-transfer/best.pt

clearml:
  task_name: resnet18-transfer
  tags: [scratch-ignore]                # switch to final-benchmark for report runs
